name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

      # The password lives only in the repository secret SITE_PASSWORD — never
      # in the repo. If it isn't set, fail loudly rather than quietly publishing
      # the site unencrypted.
      - name: Check password secret is set
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "$SITE_PASSWORD" ]; then
            echo "::error::SITE_PASSWORD secret is not set. Add it under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            echo "::error::Refusing to publish the site unencrypted."
            exit 1
          fi

      - name: Encrypt the site
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: npm run encrypt

      # Prove the build that is about to ship is actually encrypted, so a future
      # change to the pipeline can't silently publish everything in the clear.
      - name: Verify encryption
        run: |
          for phrase in "Emergency Bivy" "UA 2324" "Fairfield" "Aid Station"; do
            if grep -qF "$phrase" dist/index.html; then
              echo "::error::Found plaintext '$phrase' in the build. Aborting."
              exit 1
            fi
          done
          if ! grep -q "staticryptEncryptedMsgUniqueVariableName" dist/index.html; then
            echo "::error::Encrypted payload missing. Aborting."
            exit 1
          fi
          echo "Verified: site content is encrypted."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
