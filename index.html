<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF6EF" />
    <meta
      name="description"
      content="Interactive race guides for every IRONMAN triathlon and the world's toughest 100+ mile ultramarathons, plus a full crew/gear/nutrition toolkit for the Moab 240."
    />

    <!-- Keep the page out of search engines and AI training crawlers. Honest
         crawlers obey this; it is not enforcement. See README. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- Don't leak the URL to sites visitors click through to. -->
    <meta name="referrer" content="no-referrer" />

    <!-- The Content-Security-Policy is injected here at build time by
         vite.config.js, so it locks down the published site without breaking
         the dev server's hot-reload websocket. -->
    <title>Endurance Race Guides — IRONMAN &amp; 100-Mile Ultras</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏜️</text></svg>"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
